name: palmenheld-dev-hub-preview

services:
  prepare:
    image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    user: "0:0"
    command:
      - sh
      - -lc
      - chown -R "${DEV_HUB_UID:-10003}:${DEV_HUB_GID:-131}" /node_modules /next
    volumes:
      - preview_node_modules:/node_modules
      - preview_next:/next
    restart: "no"

  preview:
    image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    container_name: palmenheld-dev-hub-preview
    depends_on:
      prepare:
        condition: service_completed_successfully
    user: "${DEV_HUB_UID:-10003}:${DEV_HUB_GID:-131}"
    working_dir: /workspace
    command:
      - sh
      - -lc
      - npm ci && npm run build && npm run start -- --hostname 0.0.0.0
    environment:
      HOME: /tmp/palmenheld-preview-home
      NEXT_TELEMETRY_DISABLED: "1"
      BLOG_CRON_SECRET: "${BLOG_CRON_SECRET:-}"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ..:/workspace
      - preview_node_modules:/workspace/node_modules
      - preview_next:/workspace/.next
      - ../.data:/workspace/.data
      - ${DEV_HUB_ENV_FILE:-/srv/chatgpt-work-secrets/weclapp.env}:/workspace/.env.local:ro
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  preview_node_modules:
  preview_next:
